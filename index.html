V.inicio=()=>{const ac=act(),p=pend(),ve=p.filter(x=>x.dd<0).length,pr=p.filter(x=>x.dd>=0&&x.dd<=15).length,g=gest(),kg=ac.reduce((s,a)=>s+lw(a.id),0),gs=S.g.reduce((s,x)=>s+x.m,0),vn=S.v.reduce((s,x)=>s+x.neto,0),gd=ac.map(a=>gdp(a.id)).filter(x=>x!=null);

<div class="card"><h3>Pendiente</h3>${p.length?'<div class="pl">'+p.slice(0,8).map(t=>`<div class="cl" onclick="go('salud')"><div><b>${nt(an(t.a).n,t.a)}</b><small>${esc(t.med)} · ${fm(t.rf)}</small></div>${t.dd<0?`<b class="red">Vencido ${-t.dd} d</b>`:`<span class="${t.dd<=15?'ora':'grn'}">En ${t.dd} d</span>`}</div>`).join('')+'</div>':'<p>Todo al día en el corral: no hay refuerzos pendientes.</p>'}<button class="g" onclick="noti()">Activar avisos del celular</button></div>
<details class="more"><summary>Más cifras</summary>${lg('Refuerzos en 15 días',pr,pr?'ora':'')}${lg('Peso vivo total',Math.round(kg).toLocaleString()+' kg')}${lg('Ganancia diaria promedio',gd.length?Math.round(gd.reduce((a,b)=>a+b)/gd.length)+' g':'—')}${lg('Gastos registrados',money(gs))}${lg('Ventas netas',money(vn))}${lg('Balance',money(vn-gs),vn-gs<0?'red':'grn')}${lg('Costo por animal',money(gs/(ac.length||1)))}</details>
<div class="gr"><div class="card"><h3>Hato por categoría</h3>${bars(cat)}</div><div class="card"><h3>Hato por raza</h3>${bars(a=>a.r)}</div></div>`};

let EQ=null;
V.equipo=()=>{if(!ADM())return'';if(!EQ)cargarEq();const pe=(EQ||[]).filter(p=>p.rol=='peon').length;
return`<button onclick="nuevoPeon()">Crear peón</button><div class="card"><h3>Personas de ${esc(SES.fnom||'la finca')}</h3>${EQ?tbl(['Usuario','Rol',''],EQ.map(p=>tr(['@'+esc(p.usuario),p.rol=='admin'?'<b>Administrador</b>':'Peón · solo lectura',p.rol=='peon'?`<button class="s g" onclick="clavePeon('${p.user_id}','${esc(p.usuario)}')">Cambiar clave</button><button class="s d" onclick="quitarPeon('${p.user_id}','${esc(p.usuario)}')">Quitar</button>`:'']))):'<p><small>Cargando…</small></p>'}${EQ&&!pe?'<p>Todavía no hay peones. Cree el primero con el botón de arriba.</p>':''}</div><p><small>Los peones pueden ver toda la información y sacar informes, pero no pueden registrar, cambiar ni borrar nada. Esta sección no la ven.</small></p>`};
async function cargarEq(){try{const r=await api('/rest/v1/perfiles?select=user_id,usuario,rol&order=rol.asc,usuario.asc'),j=await r.json();EQ=Array.isArray(j)?j:[]}catch(e){EQ=[]}if(tab=='equipo')render()}
const eqErr=async r=>{const e=await r.json().catch(()=>({}));return e.message||e.msg||('error '+r.status)};
function nuevoPeon(){modal(`<h3>Crear peón</h3><p><small>Con este usuario y clave el peón entra a ver la información de la finca.</small></p><label>Nombre de usuario<input id="pu" autocapitalize="off" spellcheck="false" maxlength="15" oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9_]/g,'')"></label><label>Clave (mínimo 6)<input id="pc" autocomplete="off" autocapitalize="off" spellcheck="false"></label><p id="pm" class="red"></p><button id="pb" onclick="crearPeon()">Crear peón</button>`);setTimeout(()=>{const i=$('#pu');i&&i.focus()},60)}
async function crearPeon(){const u=$('#pu').value.trim(),c=$('#pc').value,m=t=>{$('#pm').textContent=t;b.disabled=false;b.textContent='Crear peón'},b=$('#pb');
if(!/^[a-z0-9_]{3,15}$/.test(u))return m('El usuario debe tener de 3 a 15 letras, números o guion bajo.');if(c.length<6)return m('La clave debe tener al menos 6 caracteres.');
b.disabled=true;b.textContent='Creando…';
try{let r=await api('/rest/v1/rpc/usuario_libre',{method:'POST',body:JSON.stringify({p_usuario:u})});if(r.ok&&(await r.json())===false)return m('Ese nombre de usuario ya está ocupado.');
r=await fetch(CF().url+'/auth/v1/signup',{method:'POST',headers:{apikey:CF().key,'Content-Type':'application/json'},body:JSON.stringify({email:correoDe(u),password:c,data:{usuario:u}})});const j=await r.json(),id=j.user&&j.user.id||j.id;
if(!id)return m(trad(j));
r=await api('/rest/v1/rpc/agregar_peon',{method:'POST',body:JSON.stringify({p_user:id,p_usuario:u})});if(!r.ok)return m('No se pudo agregar a la finca: '+await eqErr(r));
cl();EQ=null;render();toast('Peón creado: @'+u)}catch(e){m('Sin conexión. Intente de nuevo.')}}
function clavePeon(id,u){modal(`<h3>Nueva clave para @${esc(u)}</h3><label>Clave nueva (mínimo 6)<input id="pc" autocomplete="off" autocapitalize="off" spellcheck="false"></label><p id="pm" class="red"></p><button id="pb" onclick="guardarClave('${id}','${esc(u)}')">Guardar clave</button>`)}
async function guardarClave(id,u){const c=$('#pc').value;if(c.length<6)return $('#pm').textContent='La clave debe tener al menos 6 caracteres.';try{const r=await api('/rest/v1/rpc/cambiar_clave',{method:'POST',body:JSON.stringify({p_user:id,p_clave:c})});if(!r.ok)return $('#pm').textContent=await eqErr(r);cl();toast('Clave cambiada para @'+u)}catch(e){$('#pm').textContent='Sin conexión. Intente de nuevo.'}}
async function quitarPeon(id,u){if(!confirm('¿Quitar a @'+u+' de la finca? Ya no podrá entrar.'))return;try{const r=await api('/rest/v1/rpc/quitar_peon',{method:'POST',body:JSON.stringify({p_user:id})});if(!r.ok)return alert(await eqErr(r));EQ=null;render();toast('@'+u+' ya no tiene acceso')}catch(e){alert('Sin conexión. Intente de nuevo.')}}
addEventListener('online',()=>push().catch(()=>{}));
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
(async()=>{try{await hashIn()}catch(e){}
if(SES&&lmode!='new'&&!SES.finca){let ok=false;try{ok=navigator.onLine&&await perfil()}catch(e){}if(!ok)fin()}
if(SES&&lmode!='new')load();render();
if(SES&&lmode!='new'&&navigator.onLine)perfil().then(ok=>{if(ok===false){fin();render();return}return pull().then(()=>render())}).catch(()=>{})})();
</script></body></html>
